name: Build release binaries

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-x64-baseline
            asset: xal-darwin-x64
            os: darwin
            cpu: x64
          - target: bun-darwin-arm64
            asset: xal-darwin-arm64
            os: darwin
            cpu: arm64
          - target: bun-linux-x64-baseline
            asset: xal-linux-x64
            os: linux
            cpu: x64
          - target: bun-linux-arm64
            asset: xal-linux-arm64
            os: linux
            cpu: arm64
          - target: bun-linux-x64-baseline-musl
            asset: xal-linux-x64-musl
            os: linux
            cpu: x64
          - target: bun-linux-arm64-musl
            asset: xal-linux-arm64-musl
            os: linux
            cpu: arm64
          - target: bun-windows-x64-baseline
            asset: xal-windows-x64.exe
            os: win32
            cpu: x64
          - target: bun-windows-arm64
            asset: xal-windows-arm64.exe
            os: win32
            cpu: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --os="${{ matrix.os }}" --cpu="${{ matrix.cpu }}"

      - name: Compile
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          bun build --compile --minify \
            --target="$TARGET" \
            --define "XAL_VERSION=\"$VERSION\"" \
            apps/cli/src/index.ts \
            --outfile="dist/$ASSET"

      - name: Verify executable
        if: matrix.asset == 'xal-linux-x64'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod 755 dist/xal-linux-x64
          test "$(dist/xal-linux-x64 --version)" = "xal $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
